<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Act</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f2f5;
      font-family: 'Segoe UI', sans-serif;
    }

    .container {
      background: #ffffff;
      border: 2px solid #4a90e2;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(74, 144, 226, 0.2);
      padding: 48px 64px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      color: #2c3e50;
      margin-bottom: 36px;
      letter-spacing: 2px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    button {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-event {
      background-color: #4a90e2;
      color: #fff;
    }

    .btn-emergency {
      background-color: #e74c3c;
      color: #fff;
    }

    .btn-authority {
      background-color: #2ecc71;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Act</h1>
    <div class="buttons">
      <button class="btn-event" onclick="onEvent()">Event</button>
      <button class="btn-emergency" onclick="onEmergency()">Emergency</button>
      <button class="btn-authority" onclick="onAuthority()">Authority</button>
    </div>
  </div>
  <script src="event.js"></script>
  <script src="emergency.js"></script>
  <script src="authority.js"></script>
</body>
</html>
